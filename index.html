
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // IIFE to avoid polluting global scope
      (function() {
        try {
          const theme = localStorage.getItem('theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          const htmlEl = document.documentElement;
          // Use a simple dark color that approximates the theme's dark background
          const darkBgColor = '#0A0A0A';

          if (theme === 'dark' || (!theme && prefersDark)) {
            htmlEl.classList.add('dark');
            // Apply an immediate background color to prevent flash
            htmlEl.style.backgroundColor = darkBgColor;
          } else {
            htmlEl.classList.remove('dark');
            // Ensure the inline style is removed if not in dark mode
            htmlEl.style.backgroundColor = '';
          }
        } catch (e) {
          // Log error but don't break rendering
          console.error('Error applying initial theme from inline script:', e);
        }
      })();
    </script>
    <title>PromptVault</title>
    <meta name="description" content="PromptVault - Your AI Prompt Collection" />
    <meta name="author" content="PromptVault" />
    <meta property="og:image" content="/promptvault-og.png" />
  </head>

  <body>
    <div id="root"></div>
    <!-- IMPORTANT: DO NOT REMOVE THIS SCRIPT TAG OR THIS VERY COMMENT! -->
    <script src="https://cdn.gpteng.co/gptengineer.js" type="module"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
